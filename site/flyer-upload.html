<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload an Event Flyer | LCANA</title><link rel="stylesheet" href="activities.css"></head><body><main class="wrap"><a href="index.html#events">← Back to LCANA activities</a><h1>Upload an event flyer</h1><p>Take a photo of your flyer or choose a photo from your phone. Activities will review it before it appears on the website.</p><form id="uploadForm" class="card"><label for="title">Activity title *</label><input name="title" id="title" required maxlength="180"><div class="actions"><label class="button" for="camera">Take a photo</label><label class="button secondary" for="photo">Choose a phone photo</label></div><input type="file" id="camera" accept="image/*" capture="environment" hidden><input type="file" id="photo" accept="image/*" hidden><img class="preview" id="preview" hidden alt="Your flyer photo"><label for="eventDate">Event date *</label><input type="date" id="eventDate" name="eventDate" required><label for="eventTime">Start time (optional)</label><input type="time" id="eventTime" name="eventTime"><label for="endDate">Last day to show the flyer *</label><input type="date" name="endDate" id="endDate" required><p class="muted">Usually the event date. The flyer will disappear after this day, using South Carolina time.</p><label for="details">Details (optional)</label><textarea id="details" name="details" rows="3" maxlength="2000"></textarea><label class="trap" aria-hidden="true">Leave this blank<input name="website" tabindex="-1" autocomplete="off"></label><div class="actions"><button id="submit" type="submit">Send to Activities for Approval</button></div></form><p id="status" role="status" aria-live="polite"></p><a href="activities-chair.html">Activities approval sign-in</a></main><script src="flyer-upload.js?v=20261010-1"></script></body></html>
